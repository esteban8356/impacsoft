<div class="login-container">
    <div class="login-card">
        <div class="logo-container">
            <div class="hat-style"></div>
            <div class="logo-text">
                Impac<span style="color: #FF6600;">Soft</span>
            </div>
        </div>
        <h2>Zona Clientes</h2>
        <p class="subtitle">Ingresa a tu cuenta</p>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" [(ngModel)]="credentials.username" name="username" required
                    placeholder="Ej. admin">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)]="credentials.password" name="password" required
                    placeholder="Ej. admin123">
            </div>

            <div id="recaptcha-container" style="margin-bottom: 15px;" [style.display]="showCaptcha ? 'block' : 'none'">
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button type="submit" class="submit-btn" [disabled]="!credentials.username || !credentials.password">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>
